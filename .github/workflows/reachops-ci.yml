name: ReachOps CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reachops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract:
    name: Offline contract (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q ReachOps tools tests

      - name: Run full unit-test suite
        id: unit-tests
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUNBUFFERED: "1"
        run: python tools/run_reachops_ci_unittest.py --output "reports/ci/unittest-${{ runner.os }}.log"

      - name: Ensure a test-log artifact exists
        if: always()
        run: >-
          python -c "from pathlib import Path; p=Path(r'reports/ci/unittest-${{ runner.os }}.log');
          p.parent.mkdir(parents=True, exist_ok=True); p.touch(exist_ok=True);
          print(f'unit_test_log={p} exists={p.exists()} bytes={p.stat().st_size}')"

      - name: Upload complete unit-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reachops-unittest-${{ runner.os }}
          path: reports/ci/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce unit-test result
        if: ${{ steps.unit-tests.outcome != 'success' }}
        run: python -c "raise SystemExit('ReachOps unit tests failed; inspect the uploaded unittest log artifact.')"

  deterministic-audit:
    name: Deterministic delivery audits
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: offline-contract
    if: ${{ always() }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run fixture-based delivery audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/reachops_delivery_audit.py --json

      - name: Run Web-panel DOM smoke
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/reachops_web_panel_dom_smoke.py --json

      - name: Run Web-panel runtime smoke
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/reachops_web_panel_runtime_smoke.py --json

      - name: Verify repository cleanliness
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/reachops_repository_cleanliness_check.py --json

  external-acceptance-boundary:
    name: Declare external acceptance boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record non-CI acceptance scope
        shell: bash
        run: |
          cat <<'EOF'
          GitHub CI intentionally does not claim:
          - live ixBrowser account readiness;
          - authorized TikTok comment/follow/DM submission;
          - Windows installer and signed release acceptance;
          - customer outcome or commercial-effectiveness acceptance.

          Those gates require controlled target environments and evidence packs.
          See ReachOps/docs/REACHOPS_PRODUCT_COMMERCIAL_AUDIT_2026-07-13.md.
          EOF
