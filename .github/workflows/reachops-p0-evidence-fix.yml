name: ReachOps P0 evidence truthfulness fix

on:
  push:
    paths:
      - .github/workflows/reachops-p0-evidence-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reachops-truthful-execution-p0
          fetch-depth: 0
      - name: Apply evidence truthfulness patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          router_path = Path('ReachOps/workbench/action_router.py')
          text = router_path.read_text(encoding='utf-8')

          old = '''        if str(platform_result.get("status") or "") == "success":
            evidence_path = str(platform_result.get("evidence_path") or "")
            if (
                not config.dry_run
                and not config.live_preflight_only
                and config.require_execution_evidence
                and not self._valid_execution_evidence(
                    evidence_path,
                    action,
                    expected_text=rendered.rendered_text,
                    allow_uri=not config.require_local_evidence_file,
                )
            ):
                account_health = self.health_manager.record_failure(profile, "LIVE_SUBMIT_EVIDENCE_MISSING", "live submit succeeded without evidence")
                failed_result = self._record(
                    action,
                    profile,
                    "failed",
                    "LIVE_SUBMIT_EVIDENCE_MISSING",
                    "live submit succeeded without evidence",
                    "",
                    attempt,
                )
                failed_result["account_health"] = account_health
                return failed_result
            result = self._record(
                action,
                profile,
                "success",
                "",
                rendered.rendered_text,
                evidence_path or self._evidence_stub(action, profile, "success"),
                attempt,
                risk_gate={**pre_gate, "allowed": True},
                execution_mode=self._active_execution_mode,
                evidence_verified=self._active_execution_mode == "live",
            )
'''
          new = '''        if str(platform_result.get("status") or "") == "success":
            evidence_path = str(platform_result.get("evidence_path") or "")
            evidence_verified = False
            if self._active_execution_mode == "live":
                evidence_verified = self._valid_execution_evidence(
                    evidence_path,
                    action,
                    expected_text=rendered.rendered_text,
                    allow_uri=not config.require_local_evidence_file,
                )
            if (
                self._active_execution_mode == "live"
                and config.require_execution_evidence
                and not evidence_verified
            ):
                account_health = self.health_manager.record_failure(profile, "LIVE_SUBMIT_EVIDENCE_MISSING", "live submit succeeded without evidence")
                failed_result = self._record(
                    action,
                    profile,
                    "failed",
                    "LIVE_SUBMIT_EVIDENCE_MISSING",
                    "live submit succeeded without evidence",
                    "",
                    attempt,
                )
                failed_result["account_health"] = account_health
                return failed_result
            result = self._record(
                action,
                profile,
                "success",
                "",
                rendered.rendered_text,
                evidence_path or self._evidence_stub(action, profile, "success"),
                attempt,
                risk_gate={**pre_gate, "allowed": True},
                execution_mode=self._active_execution_mode,
                evidence_verified=evidence_verified,
            )
'''
          if old not in text:
              raise SystemExit('success evidence block not found')
          text = text.replace(old, new, 1)

          old2 = '''        recorded_action_status = public_status
        if public_status == "success" and execution_mode != "live":
            recorded_action_status = "approved" if str(action.get("status") or "") in {"approved", "retryable", "account_switched"} else "pending_review"
        self.storage.record_action_execution_result(
            action_id,
            execution_id,
            "completed" if public_status == "success" and execution_mode == "live" else recorded_action_status,
'''
          new2 = '''        verified_live_success = bool(
            public_status == "success"
            and execution_mode == "live"
            and submission_state == "verified_success"
            and verification_state == "verified"
            and evidence_verified
        )
        recorded_action_status = public_status
        if public_status == "success" and not verified_live_success:
            recorded_action_status = "approved" if str(action.get("status") or "") in {"approved", "retryable", "account_switched"} else "pending_review"
        self.storage.record_action_execution_result(
            action_id,
            execution_id,
            "completed" if verified_live_success else recorded_action_status,
'''
          if old2 not in text:
              raise SystemExit('record result block not found')
          text = text.replace(old2, new2, 1)

          old3 = '''        elif public_status == "success" and execution_mode == "live":
            self.storage.update_action_status(action_id, "success", "verified live action success")
        elif public_status == "success":
'''
          new3 = '''        elif verified_live_success:
            self.storage.update_action_status(action_id, "success", "verified live action success")
        elif public_status == "success":
'''
          if old3 not in text:
              raise SystemExit('action status block not found')
          text = text.replace(old3, new3, 1)

          old4 = '''            "counts_as_live_success": bool(
                public_status == "success"
                and execution_mode == "live"
                and submission_state == "verified_success"
                and verification_state == "verified"
                and evidence_verified
            ),
'''
          new4 = '''            "counts_as_live_success": verified_live_success,
'''
          if old4 not in text:
              raise SystemExit('event truth block not found')
          text = text.replace(old4, new4, 1)
          router_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_truthful_execution_semantics.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '''\n\nif __name__ == "__main__":\n    unittest.main()\n'''
          additions = r'''

    def test_live_success_without_required_evidence_stays_unverified(self):
        action = self.add_action()
        executor = AlwaysSuccessExecutor("")
        router = self.router(executor)
        result = router.run(
            [self.profile_a],
            config=ActionRouterConfig(
                max_workers=1,
                dry_run=False,
                allow_live_submit=True,
                require_authorization=False,
                require_execution_evidence=False,
                require_local_evidence_file=True,
            ),
            limit=1,
        )
        self.assertEqual(result["success"], 1)
        execution = self.storage.list_outreach_executions(limit=1)[0]
        self.assertEqual(execution["execution_mode"], "live")
        self.assertEqual(execution["submission_state"], "submitted_unverified")
        self.assertEqual(execution["verification_state"], "pending")
        self.assertEqual(int(execution["evidence_verified"]), 0)
        truth = self.storage.outreach_execution_truth_counts()
        self.assertEqual(truth["live_submitted"], 1)
        self.assertEqual(truth["live_verified"], 0)
        saved_action = next(row for row in self.storage.list_action_queue(limit=50) if row["id"] == action["id"])
        self.assertNotIn(saved_action["status"], {"success", "completed", "contacted"})

    def test_generated_evidence_stub_never_verifies_live_success(self):
        action = self.add_action("action-stub")
        router = self.router(AlwaysSuccessExecutor(""))
        router.run(
            [self.profile_a],
            config=ActionRouterConfig(
                max_workers=1,
                dry_run=False,
                allow_live_submit=True,
                require_authorization=False,
                require_execution_evidence=False,
            ),
            limit=1,
        )
        execution = self.storage.list_outreach_executions(limit=1)[0]
        self.assertTrue(str(execution["evidence_path"] or ""))
        self.assertEqual(int(execution["evidence_verified"]), 0)
        self.assertEqual(self.storage.outreach_execution_truth_counts()["live_verified"], 0)
        saved_action = next(row for row in self.storage.list_action_queue(limit=50) if row["id"] == action["id"])
        self.assertNotIn(saved_action["status"], {"success", "completed", "contacted"})
'''
          if 'test_live_success_without_required_evidence_stays_unverified' not in tests:
              if marker not in tests:
                  raise SystemExit('test insertion marker not found')
              tests = tests.replace(marker, additions + marker, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

          python -m py_compile ReachOps/workbench/action_router.py tests/test_truthful_execution_semantics.py
          python -m unittest -v tests.test_truthful_execution_semantics
          git diff --check

          rm .github/workflows/reachops-p0-evidence-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ReachOps/workbench/action_router.py tests/test_truthful_execution_semantics.py .github/workflows/reachops-p0-evidence-fix.yml
          git commit -m "Fix live evidence verification semantics"
          git push origin HEAD:agent/reachops-truthful-execution-p0
