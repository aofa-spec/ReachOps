name: ReachOps Main Regression Baseline

on:
  push:
    branches:
      - agent/reachops-truthful-execution-p0

permissions:
  contents: read

jobs:
  baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      REACHOPS_REPAIR_BACKOFF_MAX_SECONDS: "0"
      REACHOPS_BROWSER_FALLBACK_LEGACY: "0"
    steps:
      - name: Checkout main baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run main regression baseline
        shell: bash
        run: |
          set +e
          timeout 20m python -m unittest -v tests.test_reachops_campaign 2>&1 | tee reachops-main-regression-baseline.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload main baseline log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reachops-main-regression-baseline
          path: reachops-main-regression-baseline.log
          if-no-files-found: error
