name: ReachOps Truthful Execution P0

on:
  push:
    branches:
      - agent/reachops-truthful-execution-p0
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      REACHOPS_REPAIR_BACKOFF_MAX_SECONDS: "0"
      REACHOPS_BROWSER_FALLBACK_LEGACY: "0"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/reachops-truthful-execution-p0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Measure pre-change regression baseline
        shell: bash
        run: |
          set +e
          timeout 20m python -m unittest -v tests.test_reachops_campaign 2>&1 | tee reachops-regression-baseline.log
          echo "baseline_exit=${PIPESTATUS[0]}"
          exit 0

      - name: Apply scoped migrations
        run: |
          python tools/apply_truthful_execution_p0.py
          python tools/apply_truthful_execution_p0_compat.py

      - name: Compile changed Python
        run: |
          python -m py_compile \
            ReachOps/workbench/action_router.py \
            ReachOps/intelligence/storage.py \
            ReachOps/workbench/workflow_service.py \
            tools/reachops_operator_pressure.py \
            tests/test_reachops_campaign.py \
            tests/test_truthful_execution_semantics.py

      - name: Run truthful execution regression tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v tests.test_truthful_execution_semantics 2>&1 | tee truthful-execution-tests.log

      - name: Run patched ReachOps regression suite
        shell: bash
        env:
          REACHOPS_ALLOW_TEST_FIXTURE_LIVE: "1"
        run: |
          set +e
          timeout 20m python -m unittest -v tests.test_reachops_campaign 2>&1 | tee reachops-regression-patched.log
          echo "patched_exit=${PIPESTATUS[0]}"
          exit 0

      - name: Reject regressions beyond baseline
        run: |
          python tools/compare_regression_failures.py \
            reachops-regression-baseline.log \
            reachops-regression-patched.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truthful-execution-validation-logs
          path: |
            reachops-regression-baseline.log
            truthful-execution-tests.log
            reachops-regression-patched.log
          if-no-files-found: error

      - name: Validate diff
        run: |
          git diff --check
          test -n "$(git status --porcelain)"

      - name: Remove one-shot migration infrastructure from worktree
        run: |
          git rm tools/apply_truthful_execution_p0.py
          git rm tools/apply_truthful_execution_p0_compat.py
          git rm tools/compare_regression_failures.py
          git rm .github/workflows/reachops_truthful_execution_p0.yml
          git rm .github/workflows/reachops_main_regression_baseline.yml
          rm -f reachops-regression-baseline.log truthful-execution-tests.log reachops-regression-patched.log

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ReachOps/workbench/action_router.py
          git add ReachOps/intelligence/storage.py
          git add ReachOps/workbench/workflow_service.py
          git add tools/reachops_operator_pressure.py
          git add tests/test_reachops_campaign.py
          git add tests/test_truthful_execution_semantics.py
          git diff --cached --check
          git commit -m "Enforce truthful execution semantics"
          git push origin HEAD:agent/reachops-truthful-execution-p0
